<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamBox - Netflix Clone</title>
  <link rel="stylesheet" href="/static/assets/styles.css" />
  </head>
  <body>
    <div id="pageLoader" class="page-loader page-loader--active" aria-live="polite" aria-busy="true">
      <div class="page-loader__spinner" role="status" aria-label="Loading"></div>
      <p class="page-loader__text">Loading …</p>
    </div>
    <header class="nav">
      <div class="nav__logo">StreamBox</div>
      <nav class="nav__links">
        <a href="#hero" class="nav__link" data-nav="home">Home</a>
        <a href="#trending" class="nav__link" data-nav="trending">Trending</a>
        <a href="#popular" class="nav__link" data-nav="popular">Popular</a>
        <a href="#newReleases" class="nav__link" data-nav="new">New Releases</a>
      </nav>
      <input type="checkbox" id="navToggle" class="nav__toggle" aria-label="Toggle navigation" />
      <label for="navToggle" class="nav__burger" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <nav class="nav__sheet">
        <div class="nav__sheet-links">
          <a href="#hero" class="nav__link" data-nav="home">Home</a>
          <a href="#trending" class="nav__link" data-nav="trending">Trending</a>
          <a href="#popular" class="nav__link" data-nav="popular">Popular</a>
          <a href="#newReleases" class="nav__link" data-nav="new">New Releases</a>
        </div>
        <div class="nav__actions nav__actions--sheet">
          <button id="loginButtonSheet" class="btn btn--ghost">Sign In</button>
          <div id="profileMenuSheet" class="profile" hidden>
            <span id="profileNameSheet"></span>
            <button id="logoutButtonSheet" class="btn btn--ghost">Log Out</button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section id="hero" class="hero"></section>
      <section id="trending" class="row">
        <h2>Trending Now</h2>
        <div class="row__content" id="trendingRow"></div>
      </section>
      <section id="popular" class="row">
        <h2>Popular on StreamBox</h2>
        <div class="row__content" id="popularRow"></div>
      </section>
      <section id="newReleases" class="row">
        <h2>New Releases</h2>
        <div class="row__content" id="newReleasesRow"></div>
      </section>
    </main>

    <section id="player" class="player" hidden>
      <div class="player__backdrop"></div>
      <video id="playerVideo" class="player__video" playsinline preload="metadata"></video>
      <div class="player__chrome">
        <div class="player__top">
          <button id="playerClose" class="player__button player__button--close" type="button" aria-label="Close player">&times;</button>
          <div class="player__summary">
            <h2 id="playerTitle"></h2>
            <p id="playerMeta"></p>
          </div>
        </div>
        <div class="player__controls">
          <div class="player__primary">
            <button id="playerPlay" class="player__button player__button--primary" type="button" aria-label="Play/Pause"></button>
            <button id="playerMute" class="player__button" type="button" aria-label="Mute/Unmute"></button>
            <div class="player__timeline">
              <span id="playerCurrentTime" class="player__time">0:00</span>
              <input id="playerTimeline" class="player__slider" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" />
              <span id="playerDuration" class="player__time">5:00</span>
            </div>
          </div>
          <p id="playerDescription" class="player__description"></p>
        </div>
      </div>
      <div id="playerLoader" class="player__loader" hidden></div>
      <div id="playerError" class="player__error" hidden></div>
    </section>

    <template id="cardTemplate">
      <article class="card">
        <div class="card__image"></div>
        <div class="card__overlay">
          <h3 class="card__title"></h3>
          <p class="card__meta"></p>
          <div class="card__actions">
            <button class="btn btn--primary" data-action="play">Play</button>
            <button class="btn btn--ghost" data-action="watchlist"></button>
          </div>
        </div>
      </article>
    </template>

    <div id="authModal" class="modal" hidden>
      <div class="modal__dialog">
  <button id="modalClose" class="modal__close" type="button" aria-label="Close">&times;</button>
        <div class="modal__tabs">
          <button id="loginTab" class="modal__tab modal__tab--active" data-tab="login">Sign In</button>
          <button id="registerTab" class="modal__tab" data-tab="register">Sign Up</button>
        </div>
        <form id="loginForm" class="modal__form" data-form="login">
          <label>Email<input type="email" name="email" required /></label>
          <label>Password<input type="password" name="password" required /></label>
          <button type="submit" class="btn btn--primary">Sign In</button>
          <p class="modal__message" data-message="login"></p>
        </form>
        <form id="registerForm" class="modal__form modal__form--hidden" data-form="register">
          <label>Full Name<input type="text" name="full_name" required /></label>
          <label>Email<input type="email" name="email" required /></label>
          <label>Password<input type="password" name="password" required minlength="6" /></label>
          <button type="submit" class="btn btn--primary">Create Account</button>
          <p class="modal__message" data-message="register"></p>
        </form>
      </div>
    </div>

    <footer class="footer">
      <p>&copy; <span id="year"></span> StreamBox. Built as a Netflix UI clone for demo purposes.</p>
    </footer>

  <script src="/static/app.js" type="module"></script>
  </body>
</html>
