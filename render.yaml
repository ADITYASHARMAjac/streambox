services:
  - type: web
    name: streambox
    env: python
    plan: free
    rootDir: backend
  buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/data/streambox.db
    disk:
      name: streambox-data
      mountPath: /opt/render/project/data
      sizeGB: 1
